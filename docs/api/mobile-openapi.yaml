components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de sessão Supabase Auth (GoTrue). tenant_id/tenant_role/
        platform_role/entitlements vêm embutidos no JWT via
        custom_access_token_hook (Postgres, security definer) — nunca são
        aceitos de header/body separado. rental_customers e operators não
        carregam claim de tenant no JWT (a hook não tem conhecimento
        dessas tabelas) — o backend resolve tenant/organização para essas
        identidades via consulta, não via claim.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Sessão ausente ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Recurso não encontrado ou fora do escopo do tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Corpo da requisição inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      description: >
        Formato PROPOSTO (Fase 11) — o padrão real hoje em produção é
        {"error": "mensagem"} (string plana), confirmado em todas as
        rotas lidas nesta auditoria via NextResponse.json({error:...}).
        Este envelope aninhado com code/request_id NÃO está implementado;
        adotá-lo exigiria uma migração coordenada de todas as ~90 rotas
        existentes, fora do escopo desta auditoria.
      x-shina-status: proposed
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
      required: [error]

    ApiErrorCurrent:
      type: object
      description: Formato real, implementado, usado por todas as rotas hoje.
      x-shina-status: implemented
      properties:
        error:
          type: string
      required: [error]

    Pagination:
      type: object
      description: >
        Nenhum padrão de paginação consistente foi confirmado nas rotas
        lidas (a maioria retorna a lista completa sem cursor/offset).
        Recomendação (Fase 12, não implementada): cursor pagination para
        mobile, dado datasets mutáveis como operations/tracking history.
      x-shina-status: proposed
      properties:
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }

    BootstrapResponse:
      type: object
      x-shina-status: implemented
      description: >
        userType é resolvido inteiramente server-side (nunca a partir de
        input do cliente). tenant é sempre null para customer (um cliente
        pode pertencer a mais de um tenant via rental_customer_organizations
        — não existe "o" tenant dele) e para unprovisioned. organizations só
        é preenchido quando userType=customer.
      properties:
        schemaVersion:
          type: integer
          description: Incrementado sempre que o contrato do bootstrap mudar de forma incompatível.
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: [string, "null"] }
            userType:
              type: string
              enum: [tenant_user, customer, operator, unprovisioned]
        tenant:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        branding:
          type: [object, "null"]
          description: >
            Config publicada real via StudioRuntime.getPublished("branding",
            tenantId). null quando o tenant não publicou branding
            customizado, ou {"name": "Shinã"} para unprovisioned.
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: Permissões efetivas já resolvidas — a UI só usa para esconder ações, nunca como defesa.
        entitlements:
          type: array
          items: { type: string }
        features:
          type: object
          additionalProperties: { type: boolean }
        organizations:
          type: array
          description: Só presente quando user.userType = "customer".
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              tenantId: { type: string, format: uuid }

    Operation:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [delivery, pickup, maintenance, inspection, transfer]
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled, failed]
        scheduled_starts_at: { type: string, format: date-time }
        scheduled_ends_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        description: { type: [string, "null"] }
        resources:
          type: [object, "null"]
        assets:
          type: [object, "null"]

    OperationCreateRequest:
      type: object
      x-shina-status: implemented
      required: [type, resource_id, scheduled_starts_at, scheduled_ends_at]
      properties:
        type:
          type: string
          enum: [delivery, pickup, maintenance, inspection, transfer]
        resource_id: { type: string, format: uuid }
        asset_id: { type: [string, "null"], format: uuid }
        scheduled_starts_at: { type: string, format: date-time }
        scheduled_ends_at: { type: string, format: date-time }
        description: { type: [string, "null"] }

    Asset:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category:
          type: string
          enum: [vehicle, equipment, tool, property, technology]
        status:
          type: string
          enum: [available, in_use, maintenance, decommissioned]

    Operator:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        document: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        status: { type: string, enum: [active, inactive] }

    Organization:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [customer, supplier, partner, internal]
        document: { type: string }

    Contract:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [service, rental, lease, subscription, one_time]
        status:
          type: string
          enum: [draft, active, expired, terminated, suspended]
        value_amount: { type: number }
        value_currency: { type: string }
        period_starts_at: { type: string, format: date-time }
        period_ends_at: { type: string, format: date-time }
        template_id: { type: [string, "null"], format: uuid }
        snapshot_id: { type: [string, "null"], format: uuid }

    Document:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        is_mandatory: { type: boolean }
        status:
          type: [string, "null"]
          enum: [pending, approved, rejected, null]
        original_filename: { type: [string, "null"] }

    TrackingPosition:
      type: object
      x-shina-status: partial
      description: Estrutura real de resource_locations, exposta hoje só como "última posição".
      properties:
        resource_id: { type: string, format: uuid }
        latitude: { type: number }
        longitude: { type: number }
        recorded_at: { type: string, format: date-time }
        source: { type: [string, "null"] }

    Invoice:
      type: object
      x-shina-status: implemented
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, issued, paid, overdue, cancelled, voided]
        total_amount: { type: number }
        total_currency: { type: string }
        due_date: { type: string, format: date }
