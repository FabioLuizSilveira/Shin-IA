# Supabase Project Configuration — Shinã Platform (Milestone 3)
# CLI v2.x format

[api]
enabled = true
port = 54321
schemas = ["public", "events"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://app.shinaia.com.br"
additional_redirect_urls = [
  # Exact entries first — the "/**" wildcard patterns below did not
  # reliably match for the PKCE flow in production (magic-link/OAuth
  # clicks kept falling back to bare site_url instead of reaching
  # /auth/callback), so the specific paths we actually redirect to are
  # listed explicitly as a workaround alongside the wildcards.
  "https://app.shinaia.com.br/auth/callback",
  "https://shinaia.com.br/auth/callback",
  "https://mkt.shinaia.com.br/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3002/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "https://app.shinaia.com.br/**",
  "https://shinaia.com.br/**",
  "https://mkt.shinaia.com.br/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**",
  "http://localhost:3002/**",
  "http://localhost:3003/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

[auth.external.anonymous_users]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

